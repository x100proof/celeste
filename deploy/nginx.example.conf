# Example nginx site for Celeste. Replace example.com and the paths.
# TLS is omitted here; use certbot or your usual setup.

# Rate limit for the optional debug-log endpoint (must be in the http context,
# e.g. /etc/nginx/conf.d/celeste-log.conf).
# limit_req_zone $binary_remote_addr zone=celeste_log:1m rate=2r/s;

server {
    listen 80;
    server_name example.com;

    root /var/www/celeste;
    index index.html;

    # ES modules are fetched individually; revalidate so redeploys show up.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: remote debug logs (see tools/log-server.py). Write-only.
    # Without this block the game still works; log POSTs simply fail quietly.
    location = /api/log {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        # limit_req zone=celeste_log burst=30 nodelay;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8790;
        proxy_read_timeout 10s;
    }
}
